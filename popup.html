<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>viewbox-ext</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 340px; margin: 0; color: #222; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #ddd; }
    header h1 { font-size: 14px; margin: 0; flex: 1; }
    #meta { padding: 6px 12px; color: #666; display: flex; justify-content: space-between; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
    li { padding: 8px 12px; border-top: 1px solid #eee; }
    .row { display: flex; align-items: center; gap: 8px; }
    .title { flex: 1; color: inherit; text-decoration: none; }
    .title:hover, .title:focus { text-decoration: underline; }
    .new { background: #d9534f; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; }
    .warn { color: #b35c00; }
    .sub { color: #777; font-size: 11px; }
    details summary { cursor: pointer; color: #777; font-size: 11px; }
    details form { display: flex; gap: 4px; margin-top: 4px; }
    details input { flex: 1; }
    footer { padding: 8px 12px; border-top: 1px solid #ddd; }
  </style>
</head>
<body>
  <header>
    <h1>viewbox-ext</h1>
    <button id="scan">Scan now</button>
  </header>
  <div id="meta">
    <span id="status" role="status"></span>
    <label><input type="checkbox" id="onlyNew"> Only new</label>
  </div>
  <p id="loginError" class="warn" role="alert" hidden style="margin:0;padding:6px 12px"></p>
  <ul id="list"></ul>
  <footer><a href="options.html" target="_blank">Settings</a></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
